name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker compose config --quiet

      - name: Dependency audit
        run: pnpm audit --audit-level high

  docker-build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api worker web

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @implantahub/e2e exec playwright install --with-deps chromium
      - run: docker compose up -d --build postgres redis rabbitmq minio api worker web
      - name: Wait for frontend
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/login >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs api web
          exit 1
      - run: pnpm test:e2e
      - if: always()
        run: docker compose logs api worker web
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          if-no-files-found: ignore
